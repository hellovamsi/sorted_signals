# Sorted Signals — n8n Community Edition + external task runners.
# Code / Python nodes run in `task-runners`. The main container alone is not enough.
#
# Copy .env.example → .env, then: docker compose up -d
# n8n Docker: https://docs.n8n.io/hosting/installation/docker/
# Task runners: https://docs.n8n.io/hosting/configuration/task-runners/
# Needs n8n 1.113.1+ (Data tables).
#
# Host layout (created under ./files, mapped to /files in the containers):
#   files/batchupdate/prompts
#   files/batchupdate/summaries
#   files/batchupdate/articles
#   files/sortedsignals/logs

services:
  n8n-main:
    image: n8nio/n8n:latest
    container_name: n8n-main
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_PROXY_HOPS=1
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_PAYLOAD_SIZE_MAX=1024
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
    networks:
      - n8n_network

  task-runners:
    image: n8nio/runners:latest
    container_name: n8n-runners
    restart: always
    env_file:
      - .env
    environment:
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
      - N8N_RUNNERS_ENABLED_TASK_TYPES=javascript,python
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
    depends_on:
      - n8n-main
    networks:
      - n8n_network

volumes:
  n8n_data:

networks:
  n8n_network:
    driver: bridge
